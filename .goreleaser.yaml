version: 2

project_name: offstage

before:
  hooks:
    - go mod tidy

builds:
  - binary: offstage
    main: ./cmd/offstage
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Tag}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ .Arch }}"

universal_binaries:
  - replace: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

release:
  prerelease: auto

changelog:
  use: github
  abbrev: -1
  format: "{{ .Message }}"
  sort: ""
  filters:
    include:
      - '^feat(\([^)]+\))?!?:'
      - '^fix(\([^)]+\))?!?:'
      - '^perf(\([^)]+\))?!?:'
      - '^refactor(\([^)]+\))?!?:'
      - '^revert(\([^)]+\))?!?:'
  groups:
    - title: Breaking Changes
      regexp: '!:'
      order: 0
    - title: New Features
      regexp: '^feat'
      order: 1
    - title: Bug Fixes
      regexp: '^fix'
      order: 2
    - title: Performance Improvements
      regexp: '^perf'
      order: 3
    - title: Maintenance
      regexp: '^(refactor|revert)'
      order: 4
    - title: Other
      order: 999
