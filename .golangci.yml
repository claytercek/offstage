version: "2"

run:
  timeout: 2m
  go: "1.22"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - revive
    - gocritic
  settings:
    errcheck:
      # fmt.Fprint* errors are not actionable in CLI output paths.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/claytercek/offstage

exclusions:
  paths:
    - vendor/
    - .claude/
