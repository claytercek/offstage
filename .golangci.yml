version: "2"

run:
  timeout: 2m
  go: "1.22"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gocritic

linters-settings:
  goimports:
    local-prefixes: github.com/claytercek/offstage
  revive:
    rules:
      - name: exported
        disabled: true

exclusions:
  paths:
    - vendor/
    - .claude/
